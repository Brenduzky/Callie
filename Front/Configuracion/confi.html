<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="confistyle.css">
    <link rel="stylesheet" href="/../Callie/Front/Todo/todostyle.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jueguitos Callie</title>
</head>
<body>
        <section class="superior">   
            <div class="parasalir">
              <a class="salir" href="../principal/pantalla-atras.html"></a>   
            </div>
        </section>
<section class="inferior">
<section class="izquierda">
  <section class="izquierdita"></section>
  <section class="derechita">
    <section class="arribita">
  <div class="foto">
    <div class="edicion"></div>
  </div>

  <input id="perfilNombre" class="texto" type="text"
         placeholder="Nombre" readonly>

  <input id="perfilFecha" class="texto" type="text"
         placeholder="Fecha de N." readonly>
</section>
<section class="abajito"></section></section>

</section>
<section class="derecha">
<section class="contenedor">
  <div class="arriba">
    <h1>Usuario</h1>
  </div>
  <div class="bajo">
    <input id="configNombre" class="texto grande" type="text" placeholder="Nombre de usuario">
  </div>
</section>
<section class="contenedor">
  <div class="arriba">
    <h1>Contraseña</h1>
  </div>
  <div class="bajo">
    <input id="configContrasena" class="texto grande" type="password" placeholder="Nueva contraseña (opcional)">
  </div>
</section>
<section class="contenedor">
  <div class="arriba">
    <h1>Fecha de nacimiento</h1>
  </div>
  <div class="bajo">
    <input id="configFecha" class="texto grande" type="date">
  </div>
</section>
<section class="contenedor">
  <div class="arriba">
    <h1>problema</h1>
  </div>
  <div class="bajo especial">
    <select id="configProblema" class="combo">
      <option value="Trastorno de los sonidos del habla">Dislalia</option>
      <option value="Posición y movimiento de lengua">Deglución atípica</option>
      <option value="Posición y movimiento de labios">Incompetencia labial</option>
    </select>
  </div>
</section>
<div class="espaciado"></div>
<button id="guardarConfiguracion" class="chico" type="button">
  Guardar
</button>

</section>
</section>
    <script src="configuracion.js"></script>
</body>
</html>
