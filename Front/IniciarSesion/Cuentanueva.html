<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="Cuentanuevastyle.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia sesion en Callie</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    

</head>
<body>
<section class="izquierda">
    <div class="redondeado">
<h1 class="jua-regular grande">Registrarse</h1>
<form id="registrate" class="espacio">
<div class="contenedor">
    <label for="nombre-usuario" class="jua-regular chico">Nombre de Usuario</label>
    <input name="nombre-usuario" placeholder="Escribir" class="escribilo">
</div>
<div class="contenedor">
    <label for="contraseña" class="jua-regular chico">Contraseña</label>
    <input name="contraseña" placeholder="Escribir" class="escribilo">
</div>
<div class="contenedor">
    <label for="verificacion" class="jua-regular chico">Repetir contraseña</label>
    <input name="verificacion" placeholder="Escribir" class="escribilo">
</div>
<div class="contenedor">
    <label for="nacimiento" class="jua-regular chico">Fecha de nacimiento</label>
    <input name="nacimiento" placeholder="Escribir" class="escribilo">
</div>
</form></div>
</section>
<section class="derecha">


  <div class="cubo">
    <h2 class="jua-regular chiquita">Obstaculo fonoudiologico</h2>
    <div class="cubitos">
      <label class="opcion">
        <input type="radio" name="opcion" value="1">
        1
      </label>
      <label class="opcion">
        <input type="radio" name="opcion" value="2">
        2
      </label>
      <label class="opcion">
        <input type="radio" name="opcion" value="3">
        3
      </label>
    </div>
  </div>

</html>
