<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="Cuentanuevastyle.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia sesion en Callie</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

</head>
<body>
<section class="izquierda">
<h1 class="jua-regular grande">Registrarse</h1>
<div class="espacio"></div>
<div class="contenedor">
    <h2 class="jua-regular chico">Nombre de Usuario</h2>
    <input placeholder="Escribir" class="escribilo">
</div>
<div class="contenedor">
    <h2 class="jua-regular chico">Contraseña</h2>
    <input placeholder="Escribir" class="escribilo">
</div>
<div class="contenedor">
    <h2 class="jua-regular chico">Repetir contraseña</h2>
    <input placeholder="Escribir" class="escribilo">
</div>
<div class="contenedor">
    <h2 class="jua-regular chico">Fecha de nacimiento</h2>
    <input placeholder="Escribir" class="escribilo">
</div>
</section>
<section class="derecha">
<div class="cubo"></div>
<div class="abajo">
    <button class="siguiente">
        <h2 class="jua-regular">Siguiente</h2>
    </button>
<div class="callie"></div>
</div>

</section>

</body>
</html>
