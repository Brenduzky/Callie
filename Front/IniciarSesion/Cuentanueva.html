<!DOCTYPE html>
<!-- CORREGIDO: lang="en" -> lang="es" porque la página está en español -->
<html lang="es">
<head>
    <link rel="stylesheet" href="Cuentanuevastyle.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia sesion en Callie</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

</head>
<body>
<section class="izquierda">
    <div class="redondeado">
<h1 class="tipografia grande">Registrarse</h1>
<form id="registrate" class="espacio">
<div class="contenedor">
    <label for="nombre-usuario" class="tipografia chico">Nombre de Usuario</label>
    <input id="nombre-usuario" name="nombre-usuario" placeholder="Escribir" class="escribilo">
</div>
<div class="contenedor">
    <label for="contraseña" class="tipografia chico">Contraseña</label>
    <input id="contraseña" name="contraseña" placeholder="Escribir" class="escribilo">
</div>
<div class="contenedor">
    <label for="verificacion" class="tipografia chico">Repetir contraseña</label>
    <input id="verificacion" name="verificacion" placeholder="Escribir" class="escribilo">
</div>
<div class="contenedor">
    <label for="nacimiento" class="tipografia chico">Fecha de nacimiento</label>
    <input id="nacimiento" name="nacimiento" placeholder="XX/XX/XXXX" class="escribilo">
</div>
</form></div>
</section>
<section class="derecha">


  <div class="cubo">
    <h2 class="tipografia chiquita">Obstaculo fonoudiologico</h2>
    <div class="cubitos">
      <label class="opcion">
        <input type="radio" name="opcion" value="1">
        1
      </label>
      <label class="opcion">
        <input type="radio" name="opcion" value="2">
        2
      </label>
      <label class="opcion">
        <input type="radio" name="opcion" value="3">
        3
      </label>
    </div>
  </div>

    <button class="siguiente">Siguiente</button>
<div class="callie"></div>
</div>

</section>
<img class="calliete" src="../../imagenes/calliesaludando.png">
