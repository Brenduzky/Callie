<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="iniciosesionstyle.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callie</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

</head>
<body>
   <img class="fondo" src="../../imagenes/fondoprincipal.png">
<section class="izquierda">
    <div class="callie">
        <img class="calliete" src="../../imagenes/calliesaludando.png">
    </div>
    <div class="textos">
       <h2 class="tipografia chica">Bienvenido a Callie <br> Una web donde podes practicar <br> tus ejercicios de fonoaudiología <br> mientras jugás, superás desafíos <br>  y te divertís</h2>
</section>
<section class="derecha">
    <div class="cuadrado">
      <h2 class="tipografia grande">Iniciar sesion</h2>
     
      <section class="contiene">
        <div class="contenido">
          <h2 class="tipografia">Usuario</h2>
          <input id="nombre" placeholder="Escribir" class="escribilo">
        </div>
      
        <div class="contenido">
          <h2 class="tipografia">Contraseña</h2>
          <input id="contrasena" type="password" placeholder="Escribir" class="escribilo">
        </div>
      </section>
      
      <p id="mensaje" class="tipografia chiquita" style="color: red;"></p>
      
      <a href="#" id="siguiente" class="siguiente">
        <h2 class="tipografia">Siguiente</h2>
      </a>

    </div>
    <div class="texto">
        <h2 class="tipografia chiquita">¿No tenes una cuenta?</h2>
        <a href="Cuentanueva.html"><h2 class="tipografia chiquita azul">¡Registrate!</h2></a>
    </div>
</section>

<img class="marca" src="../../imagenes/marca.png">

<script src="iniciosesionjason.js"></script>
</body>
</html>
