<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="sextojuegostyle.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuentra la imagen diferente</title>
</head>
<body>
    <img class="fondo" src="../../imagenes/fondoprincipal.png">
    <section class="superior">
        <div class="ejercicio modo-intro" id="ejercicio"> <!-- El JS le cambia la clase: modo-intro / modo-juego / modo-final -->

            <!-- PANTALLA 1 (explicación) -->
            <div class="pantalla" id="intro">
                <div class="callie">
                    <img class="calliete" src="../../imagenes/calliesaludando.png" alt="">
                </div>
                <div id="burbujadetexto">
                    <p class="tipografia">En el juego debes encontrar la imagen diferente y tocarla.<br>
                       Luego, copia esa imagen y mantenla hasta que se acabe el tiempo.<br>
                       Si necesitas descansar, toca el botón para congelar el tiempo!!<br>
                       Tu puedes!!</p>
                    <button class="flecha" id="flechaIntro" aria-label="Empezar el juego">
                        <img src="../../imagenes/salir.png" alt="">
                    </button>
                </div>
            </div>

            <!-- PANTALLA 2 (el juego). El atributo data-estado lo cambia el JS:
                 buscar (elige la imagen diferente) / jugando (copia la imagen) / pausa (tiempo congelado) / exito (terminó el tiempo) -->
            <div class="pantalla" id="juego" data-estado="buscar">

                <!-- flecha para pasar a la próxima ronda (solo se ve cuando se completó el tiempo) -->
                <button class="flecha" id="flechaSiguiente" aria-label="Siguiente ronda">
                    <img src="../../imagenes/salir.png" alt="">
                </button>

                <!-- RELOJ + BARRA DEL TIEMPO (se ve solo cuando ya eligió la imagen) -->
                <div class="tiempo">
                    <div class="reloj" id="reloj"><img id="imagenReloj" alt="Reloj"></div>
                    <div class="barra-tiempo">
                        <div class="relleno" id="relleno"></div>
                    </div>
                </div>

                <p class="tipografia" id="mensaje"></p>

                <!-- LAS 3 IMÁGENES PARA ELEGIR (se ven solo en el estado "buscar").
                     Está vacío a propósito: el JS crea los 3 botones de adentro -->
                <div id="opciones"></div>

                <!-- IMAGEN A COPIAR + BOTÓN DE PAUSA (se ven después de elegir bien) -->
                <div class="zona-imagen">
                    <!-- AQUÍ SE MUESTRA LA IMAGEN DIFERENTE QUE ELIGIÓ, para que la copie -->
                    <div class="espacio-imagen" id="espacioImagen"><img id="imagenEjercicio" alt="Imagen para copiar"></div>

                    <!-- BOTÓN DE PAUSA / PLAY (tiene dos dibujitos, el CSS muestra uno u otro) -->
                    <button id="botonPausa" aria-label="Pausar o seguir el tiempo">
                        <svg class="icono-pausa" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="6" y="5" width="4" height="14" rx="1"></rect>
                            <rect x="14" y="5" width="4" height="14" rx="1"></rect>
                        </svg>
                        <svg class="icono-play" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7 4.5 L19 12 L7 19.5 Z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- PANTALLA FINAL (cuando ganó) -->
            <div class="pantalla" id="final">
                <div class="callie">
                    <img class="calliete" src="../../imagenes/calliesaludando.png" alt="">
                </div>
                <!-- "textofinal" es la tarjeta blanca del medio -->
                <div id="textofinal">
                    <!-- Los peces y el título van juntos adentro de "titulo-final" para que queden uno al lado del otro -->
                    <div class="titulo-final">
                        <img class="pez" src="../../imagenes/Pez.png" alt="">
                        <h2 class="tipografia grande">¡¡Lo lograste!!</h2>
                        <img class="pez" src="../../imagenes/Pez.png" alt="">
                    </div>

                    <p class="tipografia">Ganaste 100 peces</p>
                    <button class="tipografia" id="jugarOtraVez">Volver a jugar</button>
                </div>
            </div>
        </div>

        <button id="cerrar" aria-label="Salir">
            <img class="cerrado" src="../../imagenes/cerrar.png" alt="">
        </button>
    </section>

<!-- POPUP DE SALIR -->
<div class="modal-fondo" id="modalSalir">
    <div class="modal-caja">
        <p class="tipografia modal-texto">
            Seguro que deseas salir?<br>Perderas las monedas del dia
        </p>
        <div class="modal-botones">
            <button class="tipografia boton-cancelar" id="seguirJugando">Cancelar</button>
            <button class="tipografia boton-salir" id="salirJuego">Salir</button>
        </div>
    </div>
</div>

    <script src="sextojuegojava.js"></script> <!-- vincula el JS -->
</body>
</html>
