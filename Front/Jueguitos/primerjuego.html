<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="primerjuego.css">
    <link rel="stylesheet" href="/../Callie/Front/Todo/todostyle.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cajas iluminadas"</title>

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

</head>
<body>
     <img class="fondo" src="../../imagenes/fondoprincipal.png">
    <section class="superior">

        <!-- El cuadro grande. Empieza con la clase "modo-intro" (muestra a Callie y la burbuja).
             Después el JS lo cambia a "modo-consigna" (muestra el título y la explicación del ejercicio). -->
        <div class="ejercicio modo-intro" id="ejercicio">

            <!-- MODO INTRO (solo aparece al principio) -->
            <div id="intro">
                <!-- cuadrado donde va Callie -->
                <div id="callie">
                    <img class="calliete" src="../../imagenes/calliesaludando.png">
                </div>

                <div id="burbujadetexto">
                    <p class="tipografia media" id="texto">Tocá los botones que<br> se iluminan y hacé el <br> ejercicio! <br>
                        ¡Vos podés!</p>
                    <button class="flecha" id="flecha" aria-label="Empezar el juego">
                        <img class="salir" src="../../imagenes/salir.png">
                    </button>
                </div>
            </div>

            <!-- modo consigna: lo que aparece al tocar la caja que brilla -->
         <!-- MODO CONSIGNA CON LA CLASE AGREGADA -->
<div id="consigna">
    <button class="flecha" id="flecha2" aria-label="Cerrar">
        <img class="salidita" src="../../imagenes/salir.png">
    </button>
    <h2 id="titulo" class="tipografia"></h2>
    <p id="explicacion" class="tipografia"></p>
</div>

<!-- PANTALLA FINAL -->
<div class="pantalla" id="final">
    <div class="callie-final">
        <img class="calliete" src="../../imagenes/calliesaludando.png" alt="">

    </div>
    <div id="textofinal">
        <div class="titulo-final">
            <img class="pez pez-izq" src="../../imagenes/Pez.png" alt="">
            <h2 class="tipografia grande">¡¡Lo lograste!!</h2>
            <img class="pez pez-der" src="../../imagenes/Pez.png" alt="">
        </div>

        <p class="tipografia">Ganaste 100 peces</p>
        <button class="tipografia" id="jugarOtraVez">Volver a jugar</button>
    </div>
</div>


        </div>

        <button id="cerrar" aria-label="Salir">
            <img class="cerrado" src="../../imagenes/cerrar.png" alt="">
        </button>
    </section>

    <section class="abajo">
        <!-- data-titulo: el título que aparece en el cuadro grande.
             data-explicacion: el texto de cómo se hace el ejercicio.
             el color del cuadro grande se vuelv del color de la caja -->
        <div class="seleccion" id="primero"
             data-titulo="¡Debes hacer 10 besos!"
             data-explicacion="¿Cómo se hace? 
             1. Juntá y estirá los labios hacia adelante como para dar un beso.   
             2. Mantené tus labios así por 10 segundos. 
             3. Relajá los labios y repetí."></div>

        <div class="seleccion" id="segundo"
             data-titulo="¡Posiciona el labio superior sobre el labio inferior 10 veces!"
             data-explicacion="¿Cómo se hace? 
             1. Apoyá el labio de arriba sobre el de abajo presionando suavemente ¡Sin abrir la boca!
             2. Mantené los labios así por 10 segundos.
             3. Relajá los labios y repetí."></div>

        <div class="seleccion" id="tercero"
             data-titulo="¡Mandá 10 besos hacia la derecha!"
             data-explicacion="¿Cómo se hace? 
             1. Hacé la forma de un beso con los labios y llevalos hacia la derecha.
             2. Mantené los labios en esa posición por 10 segundos mirando al frente.
             3. Relajá los labios y repetí."></div>

        <div class="seleccion" id="cuarto"
             data-titulo="¡Sonreí sin enseñar los dientes 10 veces!"
             data-explicacion="¿Cómo se hace?  
             1. Sonreí estirando los labios hacia los costados ¡Sin abrir la boca!
             2. Mantené la sonrisa así por 10 segundos.
             3. Relajá la boca y repetí."></div>
    </section>


<!-- POPUP DE SALIR -->
<div class="modal-fondo" id="modalSalir">
    <div class="modal-caja">
        <p class="tipografia modal-texto">
            Seguro que deseas salir?<br>Perderas las monedas del dia
        </p>
        <div class="modal-botones">
            <button class="tipografia boton-cancelar" id="seguirJugando">Cancelar</button>
            <button class="tipografia boton-salir" id="salirJuego">Salir</button>
        </div>
    </div>
</div>

    <script src="primerjuego.js"></script> <!-- para vincularlo al js-->
</body>
</html>
