<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="segundojuego.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qué preferís?</title>

       
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

</head>
<body>
    <img class="fondo" src="../../imagenes/fondojuego1.png">
    <section class="superior">

        <!-- Empieza con la clase "modo-intro". El JS le va cambiando la clase -->
        <div class="ejercicio modo-intro" id="ejercicio">

            <!-- explicación del juego -->
            <div class="pantalla" id="intro">
                <button class="flecha" id="flechaIntro" aria-label="Empezar el juego">
                    <img src="../../imagenes/salir.png" alt="">
                </button>
                <p class="texto-izq tipografia alta">
                    En este juego te voy a preguntar qué preferís.<br>
                    Elegí una de las dos opciones y hacé el ejercicio que aparezca.<br>
                    ¡Vos podés!
                </p>
            </div>

            <!--Otra pantala: pregunta con las dos opciones -->
            <div class="pantalla" id="pregunta">
                <!-- el JS escribe la pregunta -->
                <p id="textoPregunta" class="tipografia alta"></p>

                <!-- los dos botones de abajo. El JS les pone lo de adentro-->
                <div class="opciones">
                    <button class="opcion" id="opcionA">
                        <span class="op-texto tipografia alta"></span>
                        <img class="op-img" alt="">
                    </button>
                    <button class="opcion" id="opcionB">
                        <span class="op-texto tipografia"></span>
                        <img class="op-img" alt="">
                    </button>
                </div>
            </div>

            <!-- tercera pantalla: el ejercicio -->
            <div class="pantalla" id="pantallaEjercicio">
                <button class="flecha" id="flechaEjercicio" aria-label="Siguiente pregunta">
                    <img src="../../imagenes/salir.png" alt="">
                </button>
                <h2 id="tituloOpcion" class="tipografia gorda"></h2>         
                <p id="tituloEjercicio" class="tipografia alta"></p>        
                <p id="explicacionEjercicio" class="tipografia alta"></p>   
            </div>

           <!-- PANTALLA FINAL -->
<div class="pantalla" id="final">

    <div id="textofinal">
        <div class="titulo-final">
            <img class="pez pez-izq" src="../../imagenes/Pez.png" alt="">
            <h2 class="tipografia grande">¡¡Lo lograste!!</h2>
            <img class="pez pez-der" src="../../imagenes/Pez.png" alt="">
        </div>

        <p class="tipografia">Ganaste 100 peces</p>
        <button class="tipografia" id="jugarOtraVez">Volver a jugar</button>
    </div>
</div>


        </div>
    </section>

    <section class="abajo">
        <div id="callie">
            <img class="calliete" src="../../imagenes/calliesaludando.png">
        </div>
    </section>

    <div class="burbujita"></div>
    <div class="burbujita otra"></div>
    <button id="cerrar" aria-label="Salir">
        <img class="cerrado" src="../../imagenes/cerrar.png" alt="">
    </button>


<!-- POPUP DE SALIR -->
<div class="modal-fondo" id="modalSalir">
    <div class="modal-caja">
        <p class="tipografia modal-texto">
            Seguro que deseas salir?<br>Perderas las monedas del dia
        </p>
        <div class="modal-botones">
            <button class="tipografia boton-cancelar" id="seguirJugando">Cancelar</button>
            <button class="tipografia boton-salir" id="salirJuego">Salir</button>
        </div>
    </div>
</div>

    <script src="segundojuego.js"></script> <!-- vincula el JS -->
</body>
</html>
